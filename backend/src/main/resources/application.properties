# FlickLAN Application Configuration
spring.application.name=FlickLAN
server.port=65005
server.address=0.0.0.0

# File Upload Limits (Support up to 500MB local transfers)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.connection-timeout=120000
server.tomcat.max-swallow-size=500MB

# Application Metadata & Update Settings
app.version=1.0.0
app.data.dir=./data
app.update.check-url=https://api.github.com/repos/flicklan/flicklan/releases/latest
app.discovery.udp-port=8888
app.discovery.interval-ms=3000

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.flicklan=INFO
logging.level.org.springframework.web=INFO
